name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security_checks:
    runs-on: ubuntu-katest
    stepes:
      - name: 1. Checkout do Codigo
        uses: actions/checkout@v4

      - name: 2. Gitleaks (Busca por credencias vazadas)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 3. Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"
      
      - name: 4. Trivy Scanner Vunerabilidade
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'